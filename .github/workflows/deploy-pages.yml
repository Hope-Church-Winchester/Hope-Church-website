name: Deploy site to GitHub Pages

# Publishes the Hope Church Winchester site to GitHub Pages.
# The site source lives in the "Hope Church Homepage Redesign" folder; that whole
# folder (pages, support.js runtime, vendored libs, design system and assets) is
# uploaded as the Pages artifact, with index.html as the entry point.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Hope Church Homepage Redesign"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
